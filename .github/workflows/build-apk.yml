name: Export Godot Android APK

on:
  workflow_dispatch:

jobs:
  export-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Godot Engine & Templates
        run: |
          GODOT_VERSION="4.3-stable"
          GODOT_DIR="4.3.stable"
          
          # Download and install Godot binary
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip Godot_v${GODOT_VERSION}_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          
          # Download and extract export templates directly into the exact version folder
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_DIR}
          unzip -q Godot_v${GODOT_VERSION}_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_DIR}/

      - name: Create Valid Export Preset
        run: |
          cat << 'EOF' > export_presets.cfg
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          encryption_include_filters=""
          encryption_exclude_filters=""
          enc_pck_password=""
          file_export_mode=0

          [preset.0.options]
          version/code=1
          version/name="1.0"
          package/unique_name="org.cannot4071.angrytux"
          EOF

      - name: Import Assets and Export Android APK
        run: |
          mkdir -p build/android
          # Force Godot to initialize and import all project resources
          godot --headless --editor --quit
          # Export release APK using the Android preset
          godot --headless --export-release "Android" build/android/angry-tux.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: angry-tux-apk
          path: build/android/angry-tux.apk
