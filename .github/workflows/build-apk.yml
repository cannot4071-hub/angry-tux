name: Export Godot Android APK

on:
  workflow_dispatch:

jobs:
  export-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK Manually
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d temp_tools
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          mv temp_tools/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
          rm -rf cmdline-tools.zip temp_tools

          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Set up Godot Engine & Templates
        run: |
          GODOT_VERSION="4.3-stable"
          GODOT_DIR="4.3.stable"
          
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip Godot_v${GODOT_VERSION}_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_DIR}
          unzip -q Godot_v${GODOT_VERSION}_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_DIR}/

      - name: Generate Android Debug Keystore & Configure Godot Settings
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

          mkdir -p ~/.config/godot
          cat << 'EOF' > ~/.config/godot/editor_settings-4.3.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/home/runner/android-sdk"
          export/android/debug_keystore = "/home/runner/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Create Missing Main Scene File
        run: |
          mkdir -p scenes
          if [ ! -f "scenes/main.tscn" ]; then
            cat << 'EOF' > scenes/main.tscn
          [gd_scene load_steps=1 format=3]

          [node name="Main" type="Node2D"]
          EOF
          fi

      - name: Create Full Android Export Preset
        run: |
          cat << 'EOF' > export_presets.cfg
          [preset.0]
          name="Android"
          platform="Android"
          runnable=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          encryption_include_filters=""
          encryption_exclude_filters=""
          enc_pck_password=""
          file_export_mode=0

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          command_line/extra_args=""
          binary_format/64_bit=true
          use_32_bits=false
          export_format=0
          custom_build/use_custom_build=false
          architectures/armv7=true
          architectures/arm64_v8a=true
          architectures/x86=false
          architectures/x86_64=false
          keystore/debug="/home/runner/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          package/unique_name="org.cannot4071.angrytux"
          package/name="Angry Tux"
          package/signed=true
          package/app_category=0
          package/retain_data_on_uninstall=false
          EOF

      - name: Initialize Project and Export Android APK
        run: |
          mkdir -p build/android
          godot --headless --path . --editor --quit
          godot --headless --path . --export-release "Android" build/android/angry-tux.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: angry-tux-apk
          path: build/android/angry-tux.apk
