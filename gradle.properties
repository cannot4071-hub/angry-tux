# Project-wide Gradle settings for maximum stability and performance
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true

# CRITICAL: Enables AndroidX packaging required by dependencies
android.useAndroidX=true
android.enableJetifier=true

# Android build optimizations
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=true
